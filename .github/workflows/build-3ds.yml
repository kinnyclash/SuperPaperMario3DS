# CI for spm3ds. First successful run: 2026-11-25 (both .3dsx files built).
#
# Job 1 runs the host tests on a standard Linux runner (Python 3, gcc).
# Job 2 installs the 3DS libraries and tools inside devkitPro's devkitARM container, then builds
#        both apps (APP=cpu and APP=gfx) and uploads both .3dsx files.
#
# The "3ds-dev" package group was confirmed by the first CI run (2026-11-25): it has 20 members,
# including libctru, citro3d, picasso, 3dstools and devkitARM, and is preinstalled in the image.
# Both apps compile with EXTRA_CFLAGS=-Werror, so a new compiler warning fails the build.
name: build-3ds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

  build-3ds:
    needs: host-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS dependencies (libctru, citro3d, picasso)
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev
      - name: Build the CPU demo (APP=cpu)
        working-directory: platform/3ds
        run: make APP=cpu EXTRA_CFLAGS=-Werror
      - name: Build the graphics demo (APP=gfx)
        working-directory: platform/3ds
        run: make APP=gfx EXTRA_CFLAGS=-Werror
      # The game app needs translated game code, which only exists on the user's computer.
      # CI builds it from the stand-in game (tools/make_game_stub.py) to check that it links.
      - name: Build the game app with the stand-in game (APP=game)
        run: |
          command -v python3 >/dev/null || (apt-get update && apt-get install -y --no-install-recommends python3)
          python3 tools/make_game_stub.py platform/3ds/source/game_generated --dol platform/3ds/stub_main.dol
          cd platform/3ds && make APP=game EXTRA_CFLAGS=-Werror
      - uses: actions/upload-artifact@v4
        with:
          name: spm3ds-3dsx
          path: platform/3ds/spm3ds.3dsx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: spm3ds-gfx-3dsx
          path: platform/3ds/spm3ds_gfx.3dsx
          if-no-files-found: error
      # The stand-in build lets you test the boot path on the console: copy stub_main.dol to
      # sdmc:/spm3ds/disc/sys/main.dol and run spm3ds_game_stub.3dsx. It is not the game.
      - uses: actions/upload-artifact@v4
        with:
          name: spm3ds-game-stub
          path: |
            platform/3ds/spm3ds_game.3dsx
            platform/3ds/stub_main.dol
          if-no-files-found: error
