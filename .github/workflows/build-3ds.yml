# CI for spm3ds. UNTESTED: this workflow has not been run on GitHub yet.
#
# Job 1 runs the host tests on a standard Linux runner (Python 3, gcc).
# Job 2 installs the 3DS libraries and tools inside devkitPro's devkitARM container, then builds
#        both apps (APP=cpu and APP=gfx) and uploads both .3dsx files.
#
# The package group name "3ds-dev" is NOT verified: the devkitPro repositories cloned for this
# project show only individual "3ds-<name>" packages (for example 3ds-pkg-config). If the
# install step fails, check the group name with `dkp-pacman -Ss 3ds` inside the container and
# list the individual packages instead (libctru, citro3d, picasso, bin2s, 3dstools).
name: build-3ds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

  build-3ds:
    needs: host-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS dependencies (libctru, citro3d, picasso)
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev
      - name: Build the CPU demo (APP=cpu)
        working-directory: platform/3ds
        run: make APP=cpu
      - name: Build the graphics demo (APP=gfx)
        working-directory: platform/3ds
        run: make APP=gfx
      - uses: actions/upload-artifact@v4
        with:
          name: spm3ds-3dsx
          path: platform/3ds/spm3ds.3dsx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: spm3ds-gfx-3dsx
          path: platform/3ds/spm3ds_gfx.3dsx
          if-no-files-found: error
